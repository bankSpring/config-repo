server.port=8081
spring.application.name=customer-service
spring.datasource.url=jdbc:postgresql://localhost:5432/bank_customer
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.auditService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.auditService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.auditService.waitDurationInOpenState=10s

logging.file.name=logs/customer-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.example=DEBUG
